name: Build data and deploy

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC; the feed refreshes 03-07
  workflow_dispatch:
    inputs:
      refresh:
        description: "Hämta feeden på nytt även om veckans kopia är cachad"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "public/**"
      - "prep/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install -r prep/requirements.txt

      # The synthetic feed exercises prep.py and both search implementations
      # without spending a Trafiklab call, so a broken build fails here first.
      - name: Self-test on the fixture
        run: |
          mkdir -p tmp
          python tools/make_fixture.py --out tmp/fixture.zip \
            --barriers tmp/fixture-barriers.geojson
          python prep/prep.py --zip tmp/fixture.zip --out tmp/fixture-data \
            --barriers tmp/fixture-barriers.geojson
          python prep/verify.py --data tmp/fixture-data --stop Brunnsparken \
            --time 08:00 --horizon 30 --top 0 --dump tmp/dump.json \
            --expect Angered --expect Frölunda --expect Mölndal \
            --expect Partille --forbid Kungälv
          node tests/client.test.mjs tmp/fixture-data tmp/dump.json

      # The fixture carries a synthetic river with one bridge across it, and
      # a tram line on the far bank that connects to nothing else -- so those
      # stops appear if and only if the walk can reach them. Three claims:
      # the water blocks, dropping the check restores the old answer, and the
      # bridge opens the crossing. The second dump cross-checks the browser
      # against the reference with stops actually being rejected, which the
      # Brunnsparken dump never exercises.
      - name: The water check does what it says
        run: |
          python prep/verify.py --data tmp/fixture-data --at 57.7105,11.9380 \
            --time 08:00 --horizon 30 --top 0 --forbid Lindholmen \
            --min-blocked 2 --dump tmp/water-dump.json
          python prep/verify.py --data tmp/fixture-data --at 57.7105,11.9380 \
            --time 08:00 --horizon 30 --top 0 --no-barriers \
            --expect Lindholmen
          python prep/verify.py --data tmp/fixture-data --at 57.7105,11.9660 \
            --time 08:00 --horizon 30 --top 0 --expect Frihamnen
          node tests/client.test.mjs tmp/fixture-data tmp/water-dump.json

      # The same check on the transfer walks, which live in the data rather
      # than in the search -- so this needs a second build to compare against.
      # Kanaltorget and Frihamnen face each other across the river 389 m
      # apart, inside the 400 m radius; the origin is placed so that neither
      # is within walking distance and Kanaltorget is only ever arrived at by
      # bus, because footpaths are relaxed on arrival and not from a seed.
      # The crow build doubles as proof that a build without geometry still
      # behaves exactly as it did before there was any.
      - name: Transfer walks do not cross the river either
        run: |
          python prep/prep.py --zip tmp/fixture.zip --out tmp/fixture-crow \
            --no-barriers
          python prep/verify.py --data tmp/fixture-crow --at 57.7080,11.9790 \
            --time 08:00 --horizon 30 --access 5 --top 0 --expect Frihamnen
          python prep/verify.py --data tmp/fixture-data --at 57.7080,11.9790 \
            --time 08:00 --horizon 30 --access 5 --top 0 --forbid Frihamnen \
            --expect Kanaltorget
          python prep/verify.py --data tmp/fixture-crow --stop Brunnsparken \
            --time 08:00 --horizon 30 --top 0 --dump tmp/crow-dump.json \
            --expect Angered --expect Frölunda --expect Mölndal \
            --expect Partille --forbid Kungälv
          node tests/client.test.mjs tmp/fixture-crow tmp/crow-dump.json

      # The feed only changes once a day and the timetable we publish is
      # weekly, so one download per calendar week is enough. A Bronze key
      # allows 60 requests per 30 days; without this, every push to main
      # would spend one.
      - name: Stamp the current week
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore this week's feed
        id: feed
        uses: actions/cache@v4
        with:
          path: vt.zip
          key: >-
            vt-feed-${{ steps.stamp.outputs.week }}-${{
              inputs.refresh && github.run_id || 'weekly' }}

      - name: Fetch GTFS Regional
        if: steps.feed.outputs.cache-hit != 'true'
        env:
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
        run: |
          if [ -z "$TRAFIKLAB_KEY" ]; then
            echo "::error::TRAFIKLAB_KEY is not set as a repository secret"
            exit 1
          fi
          # --compressed is not optional: the endpoint answers 406 unless the
          # request carries Accept-Encoding: gzip or deflate.
          curl -fsSL --compressed --retry 3 --retry-delay 20 \
            -o vt.zip "https://opendata.samtrafiken.se/gtfs/vt/vt.zip?key=$TRAFIKLAB_KEY"

      - name: Report which archive is being used
        run: |
          ls -la vt.zip
          echo "cache hit: ${{ steps.feed.outputs.cache-hit || 'false' }}"

      - name: Prepare data
        run: python prep/prep.py --zip vt.zip --out public/data

      # Acceptance criteria from the project plan, against the real timetable.
      - name: Check the result is plausible
        run: |
          python prep/verify.py --stop Brunnsparken --time 08:00 --horizon 30 \
            --top 20 --expect Angered --expect Frölunda --expect Mölndal \
            --expect Partille --forbid Kungälv
          python prep/verify.py --stop Brunnsparken --time 08:00 --horizon 60 \
            --top 10 --expect Kungälv --expect Kungsbacka --expect Alingsås \
            --dump tmp/real-dump.json
          node tests/client.test.mjs public/data tmp/real-dump.json

      # Södra Älvstranden, ten minutes' walk. Asserted by count rather than by
      # stop name: names churn between feed versions, and the claim being made
      # is only that Göta älv is in the way of something. Lindholmen is
      # deliberately not forbidden -- it genuinely is reachable from here, by
      # älvsnabben, which is a departure in the timetable and not a walk.
      - name: Göta älv blocks the walk in the real feed
        if: hashFiles('prep/barriers.geojson') != ''
        run: |
          python prep/verify.py --at 57.7040,11.9520 --time 08:00 \
            --horizon 30 --top 0 --min-blocked 4 --dump tmp/alv-dump.json
          node tests/client.test.mjs public/data tmp/alv-dump.json

      # The key only ever exists as an env var in the fetch step. Check that
      # nothing carrying it -- the archive, a request URL -- has drifted into
      # what gets published.
      - name: Make sure no credential reaches the deployed tree
        run: |
          if [ -e public/vt.zip ]; then
            echo "::error::the feed archive is inside public/"
            exit 1
          fi
          if grep -rIn -E 'samtrafiken\.se/gtfs|[?&]key=' public/; then
            echo "::error::something resembling feed credentials is in public/"
            exit 1
          fi
          echo "no credentials in public/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
